name: pages

# Static deploy to GitHub Pages. There is no PHP on Pages, so the app runs in
# its browser-only mode: plans are saved in each visitor's localStorage, and
# login, server versions and the Petrovich cart are unavailable.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # PHP endpoints can't run on Pages and would only be served as text.
      - name: Strip server-only files
        run: rm -rf dist/api dist/data/.htaccess dist/plans/.htaccess

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
